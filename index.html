<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lift" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>Lift</title>
<style>
:root {
  --bg: #0b0b0d;
  --surface: #16171b;
  --surface-2: #1f2126;
  --border: #2a2c33;
  --text: #f1f2f4;
  --muted: #8b8e97;
  --accent: #e8ff5a;
  --accent-2: #6ee7ff;
  --danger: #ff5a6c;
  --good: #66e07a;
  --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 6px 20px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
/* Top safe-area padding lives on the sticky header instead of the body, so the header can pin under the status bar. */
body { padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); }
input:focus, select:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

.app { max-width: 720px; margin: 0 auto; padding: 0 14px 170px; }

/* Sticky header: top bar + (in a workout) the exercise strip. */
.sticky {
  position: sticky; top: 0; z-index: 4;
  background: var(--bg);
  margin: 0 -14px; padding: calc(env(safe-area-inset-top) + 14px) 14px 10px;
}
header.top {
  display: flex; align-items: center; gap: 10px;
  padding: 0 4px;
  min-height: 44px;
}
.back-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 40px; height: 44px; border-radius: 12px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.back-btn svg { width: 22px; height: 22px; }
.day-pill {
  background: var(--accent); color: #000; border: none;
  border-radius: 999px; padding: 6px 12px;
  font-weight: 800; font-size: 14px; white-space: nowrap;
}
[hidden] { display: none !important; }

/* Exercise strip: one numbered button per exercise, showing status. */
.ex-strip {
  display: grid; gap: 5px; margin-top: 12px;
  grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
}
.ex-dot {
  min-width: 0; height: 40px; border-radius: 10px;
  background: var(--surface); border: 1.5px solid var(--border); color: var(--muted);
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; justify-content: center; gap: 1px;
  transition: background 150ms, border-color 150ms;
}
.ex-dot.partial { border-color: var(--good); color: var(--text); }
.ex-dot.done { background: var(--good); border-color: var(--good); color: #000; }
.ex-dot.current { border-color: var(--accent); background: var(--accent); color: #000; box-shadow: 0 0 0 2px rgba(232,255,90,0.25); }
.ex-dot.current.done { background: var(--good); box-shadow: 0 0 0 2px var(--accent); }
.ex-dot .tick { font-size: 12px; }

/* Menu: resume card */
.resume-card {
  display: flex; align-items: center; gap: 12px;
  background: rgba(232,255,90,0.08); border: 1px solid rgba(232,255,90,0.4);
  border-radius: 16px; padding: 14px; margin: 4px 0 12px;
}
.resume-card .txt { flex: 1; min-width: 0; }
.resume-card .t1 { font-weight: 800; font-size: 16px; }
.resume-card .t2 { color: var(--muted); font-size: 13px; margin-top: 2px; }
.resume-card button {
  background: var(--accent); color: #000; border: none; border-radius: 12px;
  padding: 12px 16px; font-weight: 800; font-size: 15px;
}

.next-btn {
  width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--accent-2); color: var(--accent-2);
  font-weight: 700; font-size: 15px; text-align: center;
}

@keyframes slideL { from { transform: translateX(28px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: .3; } to { transform: none; opacity: 1; } }
.exercise.anim-l { animation: slideL 160ms ease-out; }
.exercise.anim-r { animation: slideR 160ms ease-out; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: 0.5px; }
.logo .dot { color: var(--accent); }
.spacer { flex: 1; }
.icon-btn {
  background: var(--surface); border: 1px solid var(--border);
  width: 44px; height: 44px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text);
}
.icon-btn svg { width: 22px; height: 22px; }

.day-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 10px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.day-bar .label { font-size: 12px; color: var(--muted); padding: 6px 4px; width: 100%; }
.day-chip {
  flex: 1 1 0; min-width: 0;
  text-align: center; white-space: nowrap;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 2px;
  font-weight: 700; font-size: 14px;
}
.day-chip.active { background: var(--accent); color: #000; border-color: var(--accent); }
.day-chip.suggested:not(.active) { border-color: var(--accent); }

.session-meta {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  margin: 4px 4px 12px;
  color: var(--muted); font-size: 13px;
}
.session-meta .now { color: var(--text); font-weight: 600; }

.exercise {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 14px 14px 12px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.exercise.done { border-color: rgba(102,224,122,0.4); }
.ex-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ex-name { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; }
.ex-num { color: var(--muted); font-size: 13px; }
.ex-sub { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.4; }
.ex-sub b { color: var(--text); font-weight: 600; }
.pr { color: var(--accent); }
.last { color: var(--accent-2); }

.weight-row {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 0 8px;
}
.weight-row label { font-size: 12px; color: var(--muted); }
.weight-row .w-in {
  flex: 1; font-size: 18px; font-weight: 700; text-align: center;
  padding: 12px;
}
.weight-row .step {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 20px; font-weight: 800;
}
.weight-row .unit { color: var(--muted); font-size: 13px; min-width: 28px; text-align: right; }

.sets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.set-row {
  min-width: 0;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px;
}
.set-row.logged { border-color: rgba(102,224,122,0.45); background: rgba(102,224,122,0.06); }
.set-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.set-tag { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
.set-prev { font-size: 12px; color: var(--muted); }
.set-prev b { color: var(--text); font-weight: 600; }
/* One row of 7 equal buttons: 6 suggestions + custom. */
.rep-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.rep-btn {
  min-width: 0;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 11px; padding: 13px 0;
  font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden;
}
.rep-btn.center { border-color: var(--accent-2); }
.rep-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); }
.rep-btn.custom { color: var(--muted); font-size: 14px; }
.rep-btn.custom.selected { color: #000; font-size: 16px; }

.custom-row { display: flex; gap: 6px; margin-top: 8px; }
.custom-row input { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; text-align: center; padding: 10px; }
.custom-row button {
  border-radius: 11px; padding: 0 16px; font-weight: 800;
  background: var(--accent); color: #000; border: none;
}
.custom-row button.cancel { background: var(--surface); color: var(--muted); border: 1px solid var(--border); font-weight: 600; }

.ex-check { color: var(--good); font-weight: 800; }

.row-actions { display: flex; gap: 8px; margin-top: 8px; }
.row-actions .undo {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px;
}

.timer-bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px);
  background: linear-gradient(180deg, rgba(11,11,13,0) 0%, rgba(11,11,13,0.92) 35%, var(--bg) 100%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 5;
}
.timer-display {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-variant-numeric: tabular-nums;
  min-height: 48px;
}
.timer-display .big { font-size: 28px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap; }
.timer-display.warn .big { color: var(--accent); }
.timer-display.low .big { color: var(--danger); }
.timer-controls { display: flex; gap: 6px; }
.timer-chip {
  flex: 1;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 4px; font-weight: 700; font-size: 14px;
  text-align: center;
}
.timer-chip.active { background: var(--accent-2); color: #000; border-color: var(--accent-2); }
.timer-stop {
  flex: 1;
  background: var(--danger); color: #fff; border: 1px solid var(--danger);
  border-radius: 12px; padding: 10px 4px; font-weight: 800; font-size: 14px;
}

.fab-row { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.fab-row[hidden] { display: none; }
.link-btn {
  background: none; border: none; color: var(--muted);
  padding: 12px; font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.btn {
  flex: 1; padding: 14px; border-radius: 14px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); font-weight: 700; font-size: 15px;
}
.btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.warn { color: var(--danger); }

/* Sheets (Settings, History).
   The card is a column: a fixed header that never scrolls, and a scrolling body.
   The sheet sits below the iPhone status bar / notch via safe-area padding. */
.sheet {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: flex-end; justify-content: center; z-index: 10;
  padding-top: calc(env(safe-area-inset-top) + 12px);
}
.sheet.open { display: flex; }
.sheet-card {
  background: var(--bg); width: 100%; max-width: 720px;
  border-top-left-radius: 20px; border-top-right-radius: 20px;
  max-height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--border); border-bottom: none;
}
.sheet-head {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.sheet-title { font-size: 18px; font-weight: 800; flex: 1; }
.sheet-close {
  background: var(--accent); color: #000; border: none;
  height: 40px; padding: 0 18px; border-radius: 12px;
  font-weight: 800; font-size: 15px;
}
.sheet-body {
  flex: 1; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 4px 14px calc(env(safe-area-inset-bottom) + 20px);
}
.sheet-body > select { width: 100%; margin-top: 4px; }
body.sheet-open { overflow: hidden; }
.section-title { font-size: 12px; color: var(--muted); margin: 18px 4px 8px; text-transform: uppercase; letter-spacing: 0.6px; }

.ex-edit {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px; margin-bottom: 8px;
}
.ex-edit .ed-name { width: 100%; font-weight: 700; }
.ex-edit .ed-grid {
  display: grid; gap: 8px; margin-top: 8px;
  grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr) minmax(0,0.8fr) minmax(0,1.2fr);
}
.ex-edit .ed-grid-2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding-left: 2px; }
.fld input, .fld select { width: 100%; min-width: 0; padding: 9px 8px; }
.ex-edit .actions { display: flex; gap: 8px; margin-top: 10px; }
.ex-edit .actions button { flex: 1; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
.ex-edit .actions .del { color: var(--danger); border-color: rgba(255,90,108,0.4); }

.history-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
.history-row span:last-child { text-align: right; color: var(--muted); }
.history-row:last-child { border-bottom: none; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top) + 124px); /* below the header + exercise strip */
  white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 14px; font-size: 13px; z-index: 20;
  opacity: 0; transition: opacity 200ms ease;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.progress-hint {
  margin-top: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 12px; padding: 10px 12px;
  font-size: 13px; font-weight: 600; line-height: 1.4;
}
.progress-hint.good { background: rgba(232,255,90,0.08); border-color: rgba(232,255,90,0.35); color: var(--accent); }
.progress-hint.dim { color: var(--muted); }
.ex-target { margin-top: 6px; font-size: 14px; color: var(--muted); }
.ex-target b { color: var(--accent); font-weight: 700; }
.ex-note { font-size: 13px; font-weight: 600; color: var(--muted); }
.set-prev b.tgt { color: var(--accent); }

.complete-banner {
  background: rgba(102,224,122,0.1); border: 1px solid rgba(102,224,122,0.4);
  color: var(--good); border-radius: 14px; padding: 12px;
  margin-bottom: 12px; font-size: 14px; font-weight: 600;
}

.empty {
  text-align: center; color: var(--muted); padding: 40px 20px;
}

@media (max-width: 360px) {
  .rep-grid { gap: 4px; }
  .rep-btn { font-size: 15px; padding: 12px 0; }
  .rep-btn.custom { font-size: 13px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="sticky">
  <header class="top">
    <button class="back-btn" id="backBtn" aria-label="Back to workouts" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
    </button>
    <div class="logo">Lift<span class="dot">.</span></div>
    <button class="day-pill" id="dayPill" hidden></button>
    <div class="spacer"></div>
    <button class="icon-btn" id="historyBtn" title="History" aria-label="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 7 12 12 15.5 14"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
        <circle cx="9" cy="6" r="2.2" fill="var(--surface)"/><circle cx="15" cy="12" r="2.2" fill="var(--surface)"/><circle cx="7" cy="18" r="2.2" fill="var(--surface)"/>
      </svg>
    </button>
  </header>
  <nav class="ex-strip" id="exStrip" hidden></nav>
  </div>

  <!-- Menu view: pick a workout day -->
  <section id="menuView">
    <div id="resumeSlot"></div>
    <div class="day-bar">
      <div class="label">Choose workout</div>
      <button class="day-chip" data-day="UA">Upper A</button>
      <button class="day-chip" data-day="LA">Lower A</button>
      <button class="day-chip" data-day="UB">Upper B</button>
      <button class="day-chip" data-day="LB">Lower B</button>
    </div>
    <div class="session-meta" id="sessionMeta"></div>
    <div class="empty" id="menuEmpty"></div>
  </section>

  <!-- Workout view: one exercise at a time -->
  <section id="workoutView" hidden>
    <div id="completeBanner"></div>
    <div id="exerciseList"></div>
    <div id="nextSlot"></div>
    <div class="fab-row" id="fabRow">
      <button class="btn" id="finishBtn">Finish workout</button>
      <button class="link-btn" id="resetSessionBtn">Discard workout</button>
    </div>
  </section>
</div>

<div class="timer-bar" id="timerBar">
  <div class="timer-display" id="timerDisplay">
    <span class="big" id="timerBig">--:--</span>
    <span class="set-tag" id="timerLabel">REST</span>
  </div>
  <div class="timer-controls">
    <button class="timer-chip" data-secs="60">60s</button>
    <button class="timer-chip active" data-secs="90">90s</button>
    <button class="timer-chip" data-secs="120">2m</button>
    <button class="timer-chip" data-secs="180">3m</button>
    <button class="timer-stop" id="timerStop">Stop</button>
  </div>
</div>

<div class="sheet" id="settingsSheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <div class="sheet-title">Settings</div>
      <button class="sheet-close" data-close>Done</button>
    </div>
    <div class="sheet-body">

    <div class="section-title">Edit exercises</div>
    <select id="editDaySel">
      <option value="UA">Upper A</option>
      <option value="LA">Lower A</option>
      <option value="UB">Upper B</option>
      <option value="LB">Lower B</option>
    </select>
    <div id="editList" style="margin-top:10px;"></div>
    <button class="btn" id="addExerciseBtn" style="margin-top:8px;">+ Add exercise</button>

    <div class="section-title">Timer</div>
    <label style="display:flex; align-items:flex-start; gap:12px; padding:10px 4px; font-size:15px;">
      <input type="checkbox" id="vibrateChk" style="width:22px; height:22px; flex:none; margin:0;" />
      <span>Vibrate when rest ends<br/><span style="color:var(--muted); font-size:12px;">Android only - iOS doesn't support it</span></span>
    </label>

    <div class="section-title">Data</div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="exportBtn">Export JSON</button>
      <button class="btn" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
    </div>
    <button class="btn warn" id="wipeBtn" style="margin-top:8px; width:100%;">Wipe all data</button>
    </div>
  </div>
</div>

<div class="sheet" id="historySheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <div class="sheet-title">History</div>
      <button class="sheet-close" data-close>Done</button>
    </div>
    <div class="sheet-body">
    <select id="historyDaySel" style="margin-top:12px;">
      <option value="UA">Upper A</option>
      <option value="LA">Lower A</option>
      <option value="UB">Upper B</option>
      <option value="LB">Lower B</option>
    </select>
    <div id="historyList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// Storage
// ============================================================
const STORAGE_KEY = "lift.v2";
const ROTATION = ["UA", "LA", "UB", "LB"];
const DAY_LABEL = { UA: "Upper A", LA: "Lower A", UB: "Upper B", LB: "Lower B" };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn(e); }
  return defaultState();
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// Bump PLAN_VERSION whenever DEFAULT_PLAN changes: the new defaults are then applied
// once to the plan already saved on the phone (history is never touched).
const PLAN_VERSION = 2;

// Your defaults. benchmark = target per set at that weight; its length is the set count.
// aka = old names on the phone, so renamed exercises keep their history.
const DEFAULT_PLAN = {
  UA: [

    { name: "Incline Cable Fly",    weight: 13.5, unit: "kg", benchmark: [13, 12, 10, 10],    note: "per side", aka: ["Cable Fly"] },
    { name: "Lat Pulldown",         weight: 70,   unit: "kg", benchmark: [12, 11, 9, 9] },
    { name: "Cable Lateral Raise",  weight: 7.5,  unit: "kg", benchmark: [12, 11, 11],        aka: ["Lateral Raise"] },
    { name: "Face Pull",            weight: 30,   unit: "kg", benchmark: [15, 12, 11, 11] },
    { name: "Tricep Pushdown",      weight: 20,   unit: "kg", benchmark: [14, 13, 11] },
  ],
  UB: [
    { name: "Flat DB Bench",        weight: 80,   unit: "lb", benchmark: [11, 9, 9] },
    { name: "Smith Incline Press",  weight: 90,   unit: "lb", benchmark: [11, 10, 10] },
    { name: "T-Bar Row",            weight: 100,  unit: "lb", benchmark: [12, 9, 8] },
    { name: "Shoulder Press",       weight: 55,   unit: "kg", benchmark: [12, 11, 10],        aka: ["Seated DB Shoulder Press"] },
    { name: "OH Tricep Extension",  weight: 75,   unit: "kg", benchmark: [11, 11, 11] },

  ],
  LA: [

    { name: "Seated Leg Curl",             weight: 65,  unit: "kg", benchmark: [12, 12, 11] },
    { name: "Leg Extension",               weight: 65,  unit: "kg", benchmark: [12, 12, 12] },
    { name: "Leg Press",                   weight: 70,  unit: "kg", benchmark: [12, 12, 12] },
    { name: "Standing Calf Raise",         weight: 180, unit: "lb", benchmark: [14, 14, 14] },
  ],
  LB: [
    { name: "Romanian Deadlift",  weight: 140, unit: "lb", benchmark: [10, 9, 9],          aka: ["RDL"] },

    { name: "Lying Leg Curl",     weight: 40,  unit: "kg", benchmark: [12, 10, 10],        aka: ["Lying Hamstring Curl"] },
    { name: "Hip Thrust",         weight: 180, unit: "lb", benchmark: [12, 12, 12] },
    { name: "Seated Calf Raise",  weight: 115, unit: "lb", benchmark: [14, 12, 12, 12] },
    { name: "Leg Press",          weight: 60,  unit: "kg", benchmark: [20, 20, 20] },
  ],
};

// Build a plan from DEFAULT_PLAN. If an existing plan is passed, exercises with the
// same (or an old "aka") name on the same day reuse their id so history stays linked.
function buildPlan(existing) {
  const plan = {};
  for (const day of ROTATION) {
    const old = (existing && existing[day]) || [];
    const used = new Set();
    plan[day] = DEFAULT_PLAN[day].map(d => {
      const names = [d.name, ...(d.aka || [])].map(n => n.toLowerCase());
      const match = old.find(o => !used.has(o.id) && names.includes(String(o.name).toLowerCase()));
      if (match) used.add(match.id);
      return {
        id: match ? match.id : uid(),
        name: d.name,
        note: d.note || "",
        weight: d.weight,
        unit: d.unit,
        count: d.count || "reps",
        sets: d.benchmark.length,
        benchmark: d.benchmark.slice(),
      };
    });
  }
  return plan;
}

function defaultState() {
  return {
    plan: buildPlan(null),
    planVersion: PLAN_VERSION,
    history: [],
    currentSession: null,
    settings: { vibrate: false },
  };
}

function uid() { return Math.random().toString(36).slice(2, 10); }

// Bring any saved state up to date.
function migrate(s) {
  if (!s.settings) s.settings = { vibrate: false };
  if (!s.history) s.history = [];
  if ((s.planVersion || 0) < PLAN_VERSION) {
    s.plan = buildPlan(s.plan);
    s.planVersion = PLAN_VERSION;
    // An in-progress workout keeps only exercises that still exist in its day.
    if (s.currentSession) {
      const ids = new Set((s.plan[s.currentSession.day] || []).map(p => p.id));
      s.currentSession.exercises = s.currentSession.exercises.filter(e => ids.has(e.id));
    }
  }
  // Any exercise without a benchmark (e.g. older saves) gets an empty one.
  for (const day of Object.keys(s.plan)) {
    for (const p of s.plan[day]) {
      if (!Array.isArray(p.benchmark)) p.benchmark = [];
      if (p.note == null) p.note = "";
    }
  }
  return s;
}

let state = migrate(loadState());
saveState();

// ============================================================
// Helpers
// ============================================================
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

function suggestNextDay() {
  // Find the most recent completed day, then next in rotation.
  if (!state.history.length) return "UA";
  const last = state.history[state.history.length - 1].day;
  const idx = ROTATION.indexOf(last);
  return ROTATION[(idx + 1) % ROTATION.length];
}

function findLastSession(day, exId) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (h.day !== day) continue;
    const ex = h.exercises.find(e => e.id === exId);
    if (ex) return { entry: h, exercise: ex };
  }
  return null;
}

// PR: best single set "score" at the highest weight ever used.
// Score = count value (reps/secs/steps/meters). We also surface best at current weight.
function findPR(day, exId, currentWeight, currentUnit) {
  let bestEver = null;        // {weight, count, unit}
  let bestAtCurrent = null;   // {weight, count, unit}
  for (const h of state.history) {
    if (h.day !== day) continue;
    const ex = h.exercises.find(e => e.id === exId);
    if (!ex) continue;
    const unit = ex.unit || currentUnit;
    for (const s of ex.sets || []) {
      if (!s || s.count == null) continue;
      const cand = { weight: ex.weight, count: s.count, unit };
      if (!bestEver || cand.weight > bestEver.weight ||
          (cand.weight === bestEver.weight && cand.count > bestEver.count)) {
        bestEver = cand;
      }
      // Only compare against entries logged in the same unit as now.
      if (unit === currentUnit && Math.abs(ex.weight - currentWeight) < 1e-6) {
        if (!bestAtCurrent || cand.count > bestAtCurrent.count) {
          bestAtCurrent = cand;
        }
      }
    }
  }
  return { bestEver, bestAtCurrent };
}

function fmtCount(count, kind) {
  if (count == null) return "-";
  switch (kind) {
    case "secs": return count + "s";
    case "steps": return count + " steps";
    case "m": return count + "m";
    default: return count;
  }
}
function fmtWeight(w, unit) {
  if (w == null || w === 0) return "BW";
  return w + " " + unit;
}

function repCandidates(prev, kind) {
  // Returns 6 candidate values centered around prev (last-2 .. last+3).
  let step = 1;
  if (kind === "secs") step = 5;
  if (kind === "m") step = 5;
  if (kind === "steps") step = 2;
  const base = prev != null ? prev : (kind === "secs" ? 30 : kind === "m" ? 20 : kind === "steps" ? 12 : 8);
  const offsets = [-2, -1, 0, 1, 2, 3];
  return offsets.map(o => Math.max(0, base + o * step));
}

// ============================================================
// Session lifecycle
// ============================================================
// Which screen is showing. A session can be in progress while you're on the menu.
let view = "menu"; // "menu" | "workout"

function sessionLoggedCount(sess) {
  return sess ? sess.exercises.reduce((n, e) => n + e.sets.filter(s => s != null).length, 0) : 0;
}

function startSession(day) {
  // Same day as the one in progress: just resume it.
  if (state.currentSession && state.currentSession.day === day) { showWorkout(); return; }
  if (state.currentSession) {
    const n = sessionLoggedCount(state.currentSession);
    if (n > 0 && !confirm(`Your ${DAY_LABEL[state.currentSession.day]} workout has ${n} set${n === 1 ? "" : "s"} logged. Discard it and start ${DAY_LABEL[day]}?`)) return;
  }
  const plan = state.plan[day] || [];
  const exercises = plan.map(p => ({
    id: p.id,
    weight: p.weight,
    sets: Array(p.sets).fill(null),
  }));
  customOpen = null;
  state.currentSession = {
    day,
    started: Date.now(),
    exercises,
    cur: plan.length ? plan[0].id : null, // exercise currently on screen
  };
  saveState();
  showWorkout();
}

function showWorkout() { view = "workout"; window.scrollTo(0, 0); render(); }
function showMenu() { view = "menu"; customOpen = null; window.scrollTo(0, 0); render(); }

function finishSession() {
  if (!state.currentSession) { toast("No session active"); return; }
  const sess = state.currentSession;
  const anyLogged = sess.exercises.some(e => e.sets.some(s => s != null));
  if (!anyLogged) { toast("Nothing logged yet"); return; }
  const planForDay = state.plan[sess.day];
  const entry = {
    day: sess.day,
    date: new Date().toISOString(),
    exercises: sess.exercises
      .filter(e => planForDay.some(pp => pp.id === e.id))
      .map(e => {
        const p = planForDay.find(pp => pp.id === e.id);
        return {
          id: e.id,
          name: p.name,
          weight: e.weight,
          unit: p.unit,
          countKind: p.count,
          sets: e.sets.map(s => s == null ? null : { count: s.count }),
        };
      }),
  };
  state.history.push(entry);

  // Apply the benchmark rules to the plan.
  const raised = [];
  for (const p of planForDay) {
    const sx = sess.exercises.find(e => e.id === p.id);
    if (!sx) continue;
    const v = evaluateBenchmark(p, sx);
    if (v.kind === "weightUp") {
      p.weight = v.newWeight;
      p.benchmark = v.newBm;
      raised.push(p.name);
    } else if (v.kind === "raised") {
      p.benchmark = v.newBm;
      raised.push(p.name);
    }
  }

  state.currentSession = null;
  saveState();
  toast(raised.length
    ? `Saved. ${raised.length} benchmark${raised.length === 1 ? "" : "s"} raised`
    : "Workout saved");
  showMenu();
}

// Benchmark rules (agreed with Wayne):
//  - Same weight: raised only if every set >= target and at least one set > target;
//    the new benchmark is exactly what you did. Falling short never lowers it.
//  - Heavier weight: it becomes the default and what you hit becomes the benchmark.
//  - Lighter weight, or any set not logged: nothing changes.
function evaluateBenchmark(p, sx) {
  const n = p.sets;
  const bm = p.benchmark || [];
  const actual = sx.sets.slice(0, n).map(s => (s == null ? null : s.count));
  if (actual.length < n || actual.some(v => v == null)) return { kind: "incomplete" };
  const same = Math.abs(sx.weight - p.weight) < 1e-6;
  if (!same && sx.weight > p.weight) return { kind: "weightUp", newWeight: sx.weight, newBm: actual };
  if (!same) return { kind: "lighter" };
  let allMeet = true, beatAny = false;
  actual.forEach((v, i) => {
    const t = bm[i] != null ? bm[i] : 0;
    if (v < t) allMeet = false;
    if (v > t) beatAny = true;
  });
  if (allMeet && beatAny) return { kind: "raised", newBm: actual };
  if (allMeet) return { kind: "matched" };
  return { kind: "short" };
}
function fmtBm(arr) { return arr && arr.length ? arr.join(" / ") : "none yet"; }

function resetSession() {
  state.currentSession = null;
  saveState();
  showMenu();
}

// Keep the active session in sync with plan edits made mid-session:
// pick up newly added exercises and set-count changes without losing logged sets.
function reconcileSession() {
  const sess = state.currentSession;
  if (!sess) return;
  const plan = state.plan[sess.day] || [];
  let changed = false;
  for (const p of plan) {
    const sx = sess.exercises.find(e => e.id === p.id);
    if (!sx) {
      sess.exercises.push({ id: p.id, weight: p.weight, sets: Array(p.sets).fill(null) });
      changed = true;
      continue;
    }
    while (sx.sets.length < p.sets) { sx.sets.push(null); changed = true; }
    // Set count reduced: drop trailing *unlogged* sets only. Logged extras are kept.
    while (sx.sets.length > p.sets && sx.sets[sx.sets.length - 1] == null) {
      sx.sets.pop();
      changed = true;
    }
  }
  if (changed) saveState();
}

// ============================================================
// Rendering
// ============================================================
function render() {
  if (view === "workout" && !state.currentSession) view = "menu";
  const inWorkout = view === "workout";
  $("#menuView").hidden = inWorkout;
  $("#workoutView").hidden = !inWorkout;
  $("#exStrip").hidden = !inWorkout;
  $("#backBtn").hidden = !inWorkout;
  $("#dayPill").hidden = !inWorkout;
  if (inWorkout) {
    $("#dayPill").textContent = DAY_LABEL[state.currentSession.day];
    renderExercises();
  } else {
    renderDayBar();
    renderSessionMeta();
    renderMenu();
  }
  updateWakeLock();
}

function renderMenu() {
  const sess = state.currentSession;
  const slot = $("#resumeSlot");
  if (sess) {
    const total = sess.exercises.reduce((n, e) => n + e.sets.length, 0);
    const time = new Date(sess.started).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    slot.innerHTML = `
      <div class="resume-card">
        <div class="txt">
          <div class="t1">${DAY_LABEL[sess.day]} in progress</div>
          <div class="t2">${sessionLoggedCount(sess)}/${total} sets logged &middot; started ${time}</div>
        </div>
        <button id="resumeBtn">Resume</button>
      </div>`;
  } else {
    slot.innerHTML = "";
  }
  const lastH = state.history[state.history.length - 1];
  $("#menuEmpty").innerHTML = `Last completed: ${lastH ? DAY_LABEL[lastH.day] + " on " + new Date(lastH.date).toLocaleDateString() : "none yet"}`;
}

// ============================================================
// Wake lock: keep the screen on while a session is active
// ============================================================
let wakeLock = null;
async function updateWakeLock() {
  if (!("wakeLock" in navigator)) return;
  const want = !!state.currentSession;
  if (want && !wakeLock && document.visibilityState === "visible") {
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) { /* denied (e.g. low battery) - not critical */ }
  } else if (!want && wakeLock) {
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
}
// Wake locks auto-release when the app is backgrounded; re-acquire on return.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") updateWakeLock();
});

function renderDayBar() {
  const suggested = suggestNextDay();
  const active = state.currentSession ? state.currentSession.day : suggested;
  $$(".day-chip").forEach(btn => {
    const d = btn.dataset.day;
    btn.classList.toggle("active", d === active);
    btn.classList.toggle("suggested", d === suggested && d !== active);
  });
}

function renderSessionMeta() {
  const suggested = suggestNextDay();
  $("#sessionMeta").innerHTML = state.currentSession
    ? `<span>Picking a different day starts a new workout.</span>`
    : `<span>Suggested next:</span> <span class="now">${DAY_LABEL[suggested]}</span> <span>- tap to start</span>`;
}

// UI-only state (not persisted)
let customOpen = null;        // "exId:setIdx" of the set with the custom input open
let slideDir = "";            // "l" | "r" animation for the next card render
const KIND_LABEL = { reps: "REPS", secs: "SECONDS", steps: "STEPS", m: "METERS" };

// Helpers for the exercise currently on screen.
function sessionPlan() { return state.currentSession ? (state.plan[state.currentSession.day] || []) : []; }
function sessEx(id) { return state.currentSession.exercises.find(e => e.id === id); }
function isDone(id) { const sx = sessEx(id); return !!sx && sx.sets.length > 0 && sx.sets.every(s => s != null); }
function curIndex() {
  const plan = sessionPlan();
  const i = plan.findIndex(p => p.id === state.currentSession.cur);
  return i >= 0 ? i : 0;
}
// Next exercise (in plan order, wrapping) that still has unlogged sets; null if all done.
function nextUnfinished(fromIdx) {
  const plan = sessionPlan();
  for (let k = 1; k <= plan.length; k++) {
    const p = plan[(fromIdx + k) % plan.length];
    if (!isDone(p.id)) return (fromIdx + k) % plan.length;
  }
  return null;
}
function gotoExercise(idx) {
  const plan = sessionPlan();
  if (!plan[idx]) return;
  const from = curIndex();
  if (idx === from) return;
  slideDir = idx > from ? "l" : "r";
  state.currentSession.cur = plan[idx].id;
  customOpen = null;
  saveState();
  window.scrollTo(0, 0);
  renderExercises();
}

function renderExercises() {
  if (!state.currentSession) return;
  reconcileSession();
  const sess = state.currentSession;
  const plan = sessionPlan();
  const ci = curIndex();
  if (plan[ci] && sess.cur !== plan[ci].id) { sess.cur = plan[ci].id; saveState(); }

  // Strip
  $("#exStrip").innerHTML = plan.map((p, i) => {
    const sx = sessEx(p.id);
    const logged = sx ? sx.sets.filter(s => s != null).length : 0;
    const done = isDone(p.id);
    const cls = ["ex-dot", done ? "done" : (logged ? "partial" : ""), i === ci ? "current" : ""].join(" ");
    return `<button class="${cls}" data-goto="${i}" aria-label="${escapeHtml(p.name)}">${done ? `<span class="tick">&#10003;</span>` : ""}${i + 1}</button>`;
  }).join("");

  // Current exercise card
  const list = $("#exerciseList");
  list.innerHTML = "";
  const p = plan[ci];
  if (p) {
    const card = renderExerciseCard(p, sessEx(p.id), ci);
    if (slideDir) card.classList.add(slideDir === "l" ? "anim-l" : "anim-r");
    list.appendChild(card);
  } else {
    list.innerHTML = `<div class="empty">No exercises in this day. Add some in Settings.</div>`;
  }
  slideDir = "";

  // Totals, Next, Finish
  const total = sess.exercises.reduce((n, e) => n + e.sets.length, 0);
  const logged = sessionLoggedCount(sess);
  const allDone = total > 0 && logged === total;
  const ni = nextUnfinished(ci);
  $("#nextSlot").innerHTML = (ni != null && ni !== ci)
    ? `<button class="next-btn" data-goto="${ni}">Next: ${escapeHtml(plan[ni].name)} &rsaquo;</button>`
    : "";
  $("#completeBanner").innerHTML = allDone
    ? `<div class="complete-banner">All sets logged. Tap "Finish workout" to save.</div>` : "";
  $("#finishBtn").classList.toggle("primary", allDone);
}

function renderExerciseCard(p, sx, idx) {
  const last = findLastSession(state.currentSession.day, p.id);
  const lastSets = last ? (last.exercise.sets || []) : [];
  const lastWeight = last ? last.exercise.weight : null;
  const lastUnit = last ? (last.exercise.unit || p.unit) : p.unit;
  const { bestEver, bestAtCurrent } = findPR(state.currentSession.day, p.id, sx.weight, p.unit);
  const kind = p.count;
  const allDone = sx.sets.every(s => s != null);

  const card = document.createElement("div");
  card.className = "exercise" + (allDone ? " done" : "");

  const bm = p.benchmark || [];
  const subBits = [];
  if (last) {
    const lastStr = lastSets.map(s => s == null ? "-" : fmtCount(s.count, kind)).join(" / ");
    const dateStr = new Date(last.entry.date).toLocaleDateString();
    subBits.push(`<span class="last">Last (${dateStr}): ${fmtWeight(lastWeight, lastUnit)} - ${lastStr}</span>`);
  } else {
    subBits.push(`<span class="last">No prior sessions</span>`);
  }
  if (bestEver) {
    subBits.push(`<span class="pr">PR: ${fmtWeight(bestEver.weight, bestEver.unit)} x ${fmtCount(bestEver.count, kind)}</span>`);
  }

  // What happens to the benchmark at Finish, shown once every set is logged.
  let progressHint = "";
  if (allDone) {
    const v = evaluateBenchmark(p, sx);
    const msg = {
      raised:   ["good", `Benchmark beaten. New benchmark at Finish: ${fmtBm(v.newBm)}.`],
      weightUp: ["good", `Heavier than your ${fmtWeight(p.weight, p.unit)} default. At Finish, ${fmtWeight(v.newWeight, p.unit)} becomes the default with benchmark ${fmtBm(v.newBm)}.`],
      matched:  ["",     `Matched the benchmark. Beat any set next time to raise it.`],
      short:    ["dim",  `Short of the benchmark. It stays at ${fmtBm(bm)}.`],
      lighter:  ["dim",  `Lighter than your ${fmtWeight(p.weight, p.unit)} default. Benchmark unchanged.`],
    }[v.kind];
    if (msg) progressHint = `<div class="progress-hint ${msg[0]}">${msg[1]}</div>`;
  }

  card.innerHTML = `
    <div class="ex-head">
      <div class="ex-name">${allDone ? `<span class="ex-check">&#10003;</span> ` : ""}${escapeHtml(p.name)}${p.note ? ` <span class="ex-note">${escapeHtml(p.note)}</span>` : ""}</div>
      <div class="ex-num">${idx + 1}/${state.plan[state.currentSession.day].length}</div>
    </div>
    <div class="ex-target">Benchmark: <b>${fmtWeight(p.weight, p.unit)}</b> &times; <b>${fmtBm(bm)}</b></div>
    <div class="ex-sub">${subBits.join(" &middot; ")}</div>
    <div class="weight-row">
      <button class="step" data-w-step="-1" data-ex="${p.id}">-</button>
      <input class="w-in" type="number" inputmode="decimal" step="0.5" value="${sx.weight}" data-w-input data-ex="${p.id}" />
      <button class="step" data-w-step="1" data-ex="${p.id}">+</button>
      <span class="unit">${p.unit}</span>
    </div>
    <div class="sets" data-sets="${p.id}"></div>
    ${progressHint}
  `;

  const setsEl = card.querySelector('[data-sets]');
  for (let i = 0; i < sx.sets.length; i++) {
    const setVal = sx.sets[i];
    const prevVal = (lastSets[i] && lastSets[i].count != null) ? lastSets[i].count : null;
    const target = bm[i] != null ? bm[i] : null;
    // Buttons centre on the benchmark for this set (fall back to last session).
    const candidates = repCandidates(target != null ? target : prevVal, kind);
    const row = document.createElement("div");
    row.className = "set-row" + (setVal != null ? " logged" : "");
    // "Target 11 · Last 10" (weight only shown when last time differed from today's).
    const lastDiffWeight = lastWeight != null && (lastUnit !== p.unit || Math.abs(lastWeight - sx.weight) > 1e-6);
    const bits = [];
    if (target != null) bits.push(`Target <b class="tgt">${fmtCount(target, kind)}</b>`);
    if (prevVal != null) bits.push(`Last <b>${fmtCount(prevVal, kind)}</b>${lastDiffWeight ? " @ " + fmtWeight(lastWeight, lastUnit) : ""}`);
    const prevTxt = bits.length ? bits.join(" &middot; ") : "No target yet";
    const isCustomVal = setVal != null && !candidates.includes(setVal.count);
    const customHere = customOpen === `${p.id}:${i}`;
    row.innerHTML = `
      <div class="set-line">
        <span class="set-tag">SET ${i+1}${kind !== "reps" ? " &middot; " + KIND_LABEL[kind] : ""}</span>
        <span class="set-prev">${prevTxt}</span>
      </div>
      <div class="rep-grid">
        ${candidates.map((c, ci) => `
          <button class="rep-btn ${ci === 2 ? "center" : ""} ${setVal != null && setVal.count === c ? "selected" : ""}"
                  data-log data-ex="${p.id}" data-set="${i}" data-val="${c}">${c}</button>
        `).join("")}
        <button class="rep-btn custom ${isCustomVal ? "selected" : ""}" data-custom data-ex="${p.id}" data-set="${i}">${isCustomVal ? setVal.count : "+/-"}</button>
      </div>
      ${customHere ? `
        <div class="custom-row">
          <input type="number" inputmode="decimal" step="any" min="0" placeholder="${prevVal != null ? prevVal : ""}"
                 value="${setVal != null ? setVal.count : ""}" data-custom-input data-ex="${p.id}" data-set="${i}" />
          <button data-custom-ok data-ex="${p.id}" data-set="${i}">Log</button>
          <button class="cancel" data-custom-cancel>Cancel</button>
        </div>` : ""}
      ${setVal != null && !customHere ? `<div class="row-actions"><button class="undo" data-undo data-ex="${p.id}" data-set="${i}">Undo set ${i+1}</button></div>` : ""}
    `;
    setsEl.appendChild(row);
  }

  return card;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ============================================================
// Event handling
// ============================================================
document.addEventListener("click", (e) => {
  const dayChip = e.target.closest(".day-chip");
  if (dayChip) {
    startSession(dayChip.dataset.day);
    return;
  }

  const log = e.target.closest("[data-log]");
  if (log) {
    const exId = log.dataset.ex;
    const setIdx = parseInt(log.dataset.set, 10);
    const val = parseFloat(log.dataset.val);
    logSet(exId, setIdx, val);
    return;
  }

  const go = e.target.closest("[data-goto]");
  if (go) { gotoExercise(parseInt(go.dataset.goto, 10)); return; }
  if (e.target.closest("#backBtn") || e.target.closest("#dayPill")) { showMenu(); return; }
  if (e.target.closest("#resumeBtn")) { showWorkout(); return; }

  const customBtn = e.target.closest("[data-custom]");
  if (customBtn) {
    const key = `${customBtn.dataset.ex}:${customBtn.dataset.set}`;
    customOpen = customOpen === key ? null : key;
    renderExercises();
    // Focus synchronously inside the tap so iOS opens the number pad.
    const inp = $(`[data-custom-input][data-ex="${customBtn.dataset.ex}"][data-set="${customBtn.dataset.set}"]`);
    if (inp) inp.focus();
    return;
  }

  const customOk = e.target.closest("[data-custom-ok]");
  if (customOk) { submitCustom(customOk.dataset.ex, customOk.dataset.set); return; }

  if (e.target.closest("[data-custom-cancel]")) {
    customOpen = null;
    renderExercises();
    return;
  }

  const undo = e.target.closest("[data-undo]");
  if (undo) {
    const exId = undo.dataset.ex;
    const setIdx = parseInt(undo.dataset.set, 10);
    unlogSet(exId, setIdx);
    return;
  }

  const wStep = e.target.closest("[data-w-step]");
  if (wStep) {
    const exId = wStep.dataset.ex;
    const dir = parseInt(wStep.dataset.wStep, 10);
    bumpWeight(exId, dir);
    return;
  }

  const timerChip = e.target.closest(".timer-chip");
  if (timerChip) {
    const secs = parseInt(timerChip.dataset.secs, 10);
    setDefaultTimer(secs);
    return;
  }

  if (e.target.closest("#timerStop")) { stopTimer(); return; }
  if (e.target.closest("#timerDisplay")) { startTimer(defaultRest); return; }

  if (e.target.closest("#settingsBtn")) {
    openSheet("settingsSheet");
    renderEditor();
    $("#vibrateChk").checked = !!state.settings.vibrate;
    return;
  }
  if (e.target.closest("#historyBtn")) { openSheet("historySheet"); renderHistory(); return; }
  if (e.target.closest("[data-close]")) { closeSheets(); return; }
  // Tap the dimmed backdrop (outside the card) to close.
  if (e.target.classList && e.target.classList.contains("sheet")) { closeSheets(); return; }

  if (e.target.closest("#finishBtn")) { finishSession(); return; }
  if (e.target.closest("#resetSessionBtn")) {
    if (state.currentSession && confirm("Discard current session?")) resetSession();
    return;
  }

  if (e.target.closest("#exportBtn")) { exportData(); return; }
  if (e.target.closest("#importBtn")) { $("#importFile").click(); return; }
  if (e.target.closest("#wipeBtn")) {
    if (confirm("Wipe all data permanently?")) { state = defaultState(); saveState(); render(); closeSheets(); }
    return;
  }
  if (e.target.closest("#addExerciseBtn")) {
    const day = $("#editDaySel").value;
    state.plan[day].push({ id: uid(), name: "New exercise", note: "", weight: 0, unit: "lb", sets: 3, count: "reps", benchmark: [] });
    saveState(); renderEditor();
    return;
  }
});

document.addEventListener("input", (e) => {
  const wIn = e.target.closest("[data-w-input]");
  if (wIn) {
    const exId = wIn.dataset.ex;
    const v = parseFloat(wIn.value);
    if (!isNaN(v)) setWeight(exId, v);
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "editDaySel") renderEditor();
  if (e.target.id === "historyDaySel") renderHistory();
  if (e.target.matches && e.target.matches("[data-w-input]")) renderExercises();
  if (e.target.id === "vibrateChk") {
    state.settings.vibrate = e.target.checked;
    saveState();
  }
  if (e.target.id === "importFile") {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data.plan && data.history) {
          state = migrate(data);
          saveState();
          toast("Imported");
          render();
          closeSheets();
        } else { toast("Invalid file"); }
      } catch (err) { toast("Parse error"); }
    };
    r.readAsText(f);
  }
});

function submitCustom(exId, setIdx) {
  const inp = $(`[data-custom-input][data-ex="${exId}"][data-set="${setIdx}"]`);
  const n = inp ? parseFloat(inp.value) : NaN;
  if (isNaN(n) || n < 0) { toast("Enter a number"); return; }
  customOpen = null;
  logSet(exId, parseInt(setIdx, 10), n);
}

// Enter key on the custom input logs the value.
document.addEventListener("keydown", (e) => {
  const inp = e.target.closest && e.target.closest("[data-custom-input]");
  if (inp && e.key === "Enter") { e.preventDefault(); submitCustom(inp.dataset.ex, inp.dataset.set); }
});

function logSet(exId, setIdx, value) {
  if (!state.currentSession) return;
  const ex = state.currentSession.exercises.find(e => e.id === exId);
  if (!ex) return;
  const wasDone = ex.sets.every(s => s != null);
  ex.sets[setIdx] = { count: value };
  customOpen = null;
  saveState();
  renderExercises();
  startTimer(defaultRest);
  // Exercise just became complete: after a beat (so you see the tick), jump to the
  // next unfinished exercise. Skips ones you've already done out of order.
  if (!wasDone && ex.sets.every(s => s != null)) {
    const ni = nextUnfinished(curIndex());
    if (ni != null) {
      toast("Next: " + sessionPlan()[ni].name);
      setTimeout(() => {
        // Only move if you're still on the exercise you just finished.
        if (view === "workout" && state.currentSession && state.currentSession.cur === exId) gotoExercise(ni);
      }, 600);
    } else {
      toast("All sets logged - tap Finish workout");
    }
  }
}

// Swipe left/right on the exercise to move between exercises.
(function setupSwipe() {
  let x0 = null, y0 = null, t0 = 0;
  const area = document.getElementById("workoutView");
  area.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || e.target.closest("input, select, .custom-row")) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  area.addEventListener("touchend", (e) => {
    if (x0 == null || view !== "workout") return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    // Deliberate horizontal swipe only: long enough, mostly sideways, reasonably quick.
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - t0 > 600) return;
    const ci = curIndex(), n = sessionPlan().length;
    if (dx < 0 && ci < n - 1) gotoExercise(ci + 1);
    if (dx > 0 && ci > 0) gotoExercise(ci - 1);
  }, { passive: true });
})();
function unlogSet(exId, setIdx) {
  if (!state.currentSession) return;
  const ex = state.currentSession.exercises.find(e => e.id === exId);
  if (!ex) return;
  ex.sets[setIdx] = null;
  saveState();
  renderExercises();
}
function setWeight(exId, w) {
  if (!state.currentSession) return;
  const ex = state.currentSession.exercises.find(e => e.id === exId);
  if (!ex) return;
  // Session only. The default weight changes at Finish, per the benchmark rules.
  ex.weight = w;
  saveState();
  // No re-render here (would steal focus from the input); the "change" event re-renders on blur.
}
function bumpWeight(exId, dir) {
  if (!state.currentSession) return;
  const ex = state.currentSession.exercises.find(e => e.id === exId);
  if (!ex) return;
  const planEx = state.plan[state.currentSession.day].find(p => p.id === exId);
  const step = (planEx && planEx.unit === "kg") ? 1.25 : 2.5;
  ex.weight = Math.max(0, +(ex.weight + dir * step).toFixed(2));
  saveState();
  renderExercises();
}

// ============================================================
// Timer (silent, visual only)
// ============================================================
let defaultRest = 90;
let timerEnd = 0;
let timerInterval = null;

function setDefaultTimer(secs) {
  defaultRest = secs;
  $$(".timer-chip").forEach(c => c.classList.toggle("active", parseInt(c.dataset.secs,10) === secs));
}
function startTimer(secs) {
  stopTimer();
  timerEnd = Date.now() + secs * 1000;
  $("#timerLabel").textContent = "REST";
  tickTimer();
  timerInterval = setInterval(tickTimer, 200);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  $("#timerBig").textContent = "--:--";
  $("#timerDisplay").classList.remove("warn", "low");
}
function tickTimer() {
  const left = Math.max(0, timerEnd - Date.now());
  const s = Math.ceil(left / 1000);
  const mm = Math.floor(s / 60);
  const ss = s % 60;
  $("#timerBig").textContent = `${mm}:${String(ss).padStart(2, "0")}`;
  const disp = $("#timerDisplay");
  disp.classList.toggle("warn", s <= 15 && s > 5);
  disp.classList.toggle("low", s <= 5 && s > 0);
  if (left <= 0) {
    stopTimer();
    $("#timerBig").textContent = "GO";
    $("#timerLabel").textContent = "READY";
    if (state.settings.vibrate && navigator.vibrate) {
      navigator.vibrate([200, 100, 200]);
    }
  }
}

// ============================================================
// Sheets, editor, history
// ============================================================
function openSheet(id) {
  // Default the day pickers to the day you're on (or the suggested one).
  const day = state.currentSession ? state.currentSession.day : suggestNextDay();
  if (id === "settingsSheet") $("#editDaySel").value = day;
  if (id === "historySheet") $("#historyDaySel").value = day;
  const sheet = $("#" + id);
  sheet.classList.add("open");
  sheet.querySelector(".sheet-body").scrollTop = 0;
  document.body.classList.add("sheet-open");
}
function closeSheets() {
  $$(".sheet").forEach(s => s.classList.remove("open"));
  document.body.classList.remove("sheet-open");
  render(); // pick up any plan edits made in Settings
}

function renderEditor() {
  const day = $("#editDaySel").value;
  const list = $("#editList");
  const items = state.plan[day] || [];
  list.innerHTML = items.map((p, i) => `
    <div class="ex-edit" data-edit="${p.id}">
      <input class="ed-name" data-f="name" type="text" value="${escapeHtml(p.name)}" placeholder="Exercise name" />
      <div class="ed-grid">
        <label class="fld"><span>Weight</span>
          <input data-f="weight" type="number" inputmode="decimal" step="0.5" value="${p.weight}" />
        </label>
        <label class="fld"><span>Unit</span>
          <select data-f="unit">
            <option value="lb" ${p.unit==="lb"?"selected":""}>lb</option>
            <option value="kg" ${p.unit==="kg"?"selected":""}>kg</option>
          </select>
        </label>
        <label class="fld"><span>Sets</span>
          <input data-f="sets" type="number" inputmode="numeric" min="1" max="10" value="${p.sets}" />
        </label>
        <label class="fld"><span>Count</span>
          <select data-f="count">
            <option value="reps" ${p.count==="reps"?"selected":""}>reps</option>
            <option value="secs" ${p.count==="secs"?"selected":""}>secs</option>
            <option value="steps" ${p.count==="steps"?"selected":""}>steps</option>
            <option value="m" ${p.count==="m"?"selected":""}>meters</option>
          </select>
        </label>
      </div>
      <div class="ed-grid ed-grid-2">
        <label class="fld"><span>Benchmark per set</span>
          <input data-f="benchmark" type="text" inputmode="text" value="${(p.benchmark || []).join(" / ")}" placeholder="e.g. 11 / 9 / 9" />
        </label>
        <label class="fld"><span>Note</span>
          <input data-f="note" type="text" value="${escapeHtml(p.note || "")}" placeholder="e.g. per side" />
        </label>
      </div>
      <div class="actions">
        <button data-mv="-1" ${i === 0 ? "disabled style='opacity:.35'" : ""}>&uarr; Up</button>
        <button data-mv="1" ${i === items.length - 1 ? "disabled style='opacity:.35'" : ""}>&darr; Down</button>
        <button class="del" data-del>Delete</button>
      </div>
    </div>
  `).join("");

  list.querySelectorAll(".ex-edit").forEach(card => {
    const id = card.dataset.edit;
    card.querySelectorAll("input,select").forEach(el => {
      el.addEventListener("change", () => {
        const p = state.plan[day].find(x => x.id === id);
        if (!p) return;
        const f = el.dataset.f;
        if (f === "weight") p.weight = parseFloat(el.value) || 0;
        else if (f === "sets") {
          // Keep the benchmark the same length as the set count.
          p.sets = Math.min(10, Math.max(1, parseInt(el.value, 10) || 1));
          const bm = p.benchmark || [];
          if (bm.length > p.sets) p.benchmark = bm.slice(0, p.sets);
          else if (bm.length && bm.length < p.sets) {
            while (bm.length < p.sets) bm.push(bm[bm.length - 1]);
            p.benchmark = bm;
          }
          saveState(); renderEditor(); return;
        } else if (f === "benchmark") {
          // Accept "11/9/9", "11 9 9", "11, 9, 9". The benchmark sets the set count.
          const nums = el.value.split(/[^0-9.]+/).filter(Boolean).map(Number).filter(n => !isNaN(n));
          p.benchmark = nums.slice(0, 10);
          if (nums.length) p.sets = p.benchmark.length;
          saveState(); renderEditor(); return;
        }
        else p[f] = el.value;
        saveState();
      });
    });
    card.querySelector("[data-del]").addEventListener("click", () => {
      if (!confirm("Delete this exercise from the plan?")) return;
      state.plan[day] = state.plan[day].filter(x => x.id !== id);
      saveState(); renderEditor();
    });
    card.querySelectorAll("[data-mv]").forEach(b => {
      b.addEventListener("click", () => {
        const dir = parseInt(b.dataset.mv, 10);
        const arr = state.plan[day];
        const i = arr.findIndex(x => x.id === id);
        const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        saveState(); renderEditor();
      });
    });
  });
}

function renderHistory() {
  const day = $("#historyDaySel").value;
  const list = $("#historyList");
  const entries = state.history.filter(h => h.day === day).slice().reverse();
  if (!entries.length) { list.innerHTML = `<div class="empty">No history for ${DAY_LABEL[day]}</div>`; return; }
  list.innerHTML = entries.map(h => {
    const date = new Date(h.date).toLocaleString();
    const lines = h.exercises.map(ex => {
      const sets = (ex.sets || []).map(s => s == null ? "-" : fmtCount(s.count, ex.countKind)).join(" / ");
      return `<div class="history-row"><span>${escapeHtml(ex.name)}</span><span>${fmtWeight(ex.weight, ex.unit)} - ${sets}</span></div>`;
    }).join("");
    return `<div class="ex-edit"><div style="font-weight:700; margin-bottom:6px;">${date}</div>${lines}</div>`;
  }).join("");
}

async function exportData() {
  const json = JSON.stringify(state, null, 2);
  const filename = `lift-backup-${new Date().toISOString().slice(0,10)}.json`;
  // In an installed PWA on iOS, programmatic downloads are unreliable.
  // Prefer the share sheet (Save to Files / AirDrop / etc.) when available.
  if (navigator.canShare) {
    const file = new File([json], filename, { type: "application/json" });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Lift backup" });
        return;
      } catch (e) {
        if (e.name === "AbortError") return; // user cancelled
        // fall through to download
      }
    }
  }
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

let toastT;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 1800);
}

// ============================================================
// Boot
// ============================================================
// Reopening the app mid-workout drops you straight back into it.
view = state.currentSession ? "workout" : "menu";
render();

// Real offline support: cache app shell via service worker.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
// Ask the browser not to evict localStorage under storage pressure.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
</script>
